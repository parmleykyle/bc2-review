<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Design review</title><style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2a27;--muted:#6f6a61;--line:#e4ded3;--accent:#6b7a5e;--brass:#a67c2e;--yes:#4f7a4a;--no:#a34a3c;--maybe:#b08a2e}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 120px}
header h1{font:600 24px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.basis{background:#efe9df;border-left:4px solid var(--brass);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.basis b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin-bottom:2px}
label.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2{font:600 20px/1.25 Georgia,serif;margin:0 0 4px}
.why{color:var(--muted);font-size:14px;margin:0 0 10px}
.pick{background:#f3efe4;border-radius:10px;padding:9px 11px;font-size:14px;margin:0 0 12px}
.pick b{color:var(--brass)}
.opt{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.opt.is-pick{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.opt img{display:block;width:100%;height:240px;object-fit:contain;background:#fff}
.swatch{height:150px;display:flex;align-items:flex-end;padding:10px;font-size:13px;color:rgba(0,0,0,.6)}
.ob{padding:10px 12px 12px}
.badge{display:inline-block;background:var(--brass);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;margin-bottom:6px}
.ot{font-weight:600;margin:0 0 4px}
.price{font-size:14px;color:var(--ink);margin:0 0 4px}
.note{font-size:13px;color:var(--muted);margin:0 0 8px}
.ob a{color:var(--accent)}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.vote input{position:absolute;opacity:0;pointer-events:none}
.vote label{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;font-size:16px;background:#faf8f4;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.vote input:checked+label.y{background:var(--yes);border-color:var(--yes);color:#fff}
.vote input:checked+label.n{background:var(--no);border-color:var(--no);color:#fff}
.vote input:checked+label.m{background:var(--maybe);border-color:var(--maybe);color:#fff}
.vote input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.onote{margin-top:8px;min-height:44px;font-size:14px}
.submitbar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,238,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.submitbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.count{font-size:13px;color:var(--muted);flex:1}
button.submit{min-height:52px;padding:0 22px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:600 17px/1 inherit;font-family:inherit}
button.submit[disabled]{opacity:.6}
.err{color:var(--no);font-size:14px;margin-top:6px;display:none}
.done{display:none;background:#fff;border:2px solid var(--yes);border-radius:16px;padding:22px 16px;text-align:center;margin:20px 0}
.done h2{font:600 22px Georgia,serif;margin:6px 0}
.done .tick{font-size:44px;color:var(--yes)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style></head><body><div class="wrap"><header><h1>Design review</h1><p class="sub">Pick a room to review on your phone.</p></header><section class="card"><h2><a href="bedroom-2/">Bedroom 2</a></h2><p class="why">Paint, flooring, lighting, curtains, door knobs, closet, rug.</p></section></div></body></html>
